# Specific Tutor Settings
Specific-Tutor:
  # "specific" = fixed move list, "general" = all learnable moves (like General Tutor)
  mode: specific
  # Permission needed to open
  permission: tutormoves.open.dragonmaster
  # Options: impactor:{currency}, ITEMS:{item id}, or ITEMS:{item id}:{customModelData}
  currencyKey: ITEMS:minecraft:diamond
  # Optional display name for the item currency (e.g., "Diamonds"). Falls back to item name for ITEMS economy.
  currencyName: "<aqua>Diamonds"
  # The cost of teaching moves
  cost: 3
  # Optional: override global Move-Options for this tutor
  # If omitted, uses the global Move-Options from config.yml
  # Move-Options:
  #   tutorMoves: true
  #   eggMoves: false
  #   tmMoves: true
  #   evolutionMoves: false
  #   levelUpMoves: false
  #   formChangeMoves: false
  #   legacyMoves: false
  #   specialMoves: false
  # List of Moves the Tutor Offers
  moves:
    - dracometeor
    - dragonclaw
    - dragondance
    # Use type: prefix to include all learnable moves of a type
    # - type:dragon
  # Moves that should not appear in this tutor's GUI
  Blacklisted-Moves: []
  # Pokemon that should not be able to use this tutor
  Blacklisted-Pokemon:
    - jirachi
Specific-Tutor-GUI:
  # The GUI Title
  title: "Dragon Master"
  # The Size of the Main Tutor GUI (2-6)
  size: 6
  # GUI Elements
  filler-item: "minecraft:gray_stained_glass_pane"
# Override the cost of specific moves
# Format - move:cost
Specific-Tutor-Move-Overrides:
  outrage: 6000
  dracometeor: 10000

# DON'T TOUCH Config-Version OR THINGS WILL BREAK
Config-Version: 2.3